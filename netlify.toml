[build]
  command = "npm run build"
  publish = "dist"

# Redirect all routing to index.html for Single-Page Application (SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache and inline display headers for PDF prints
[[headers]]
  for = "/prints/*"
  [headers.values]
    Content-Type = "application/pdf"
    Content-Disposition = "inline"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"
